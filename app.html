<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Приложение — WingAso Analytics</title>
  <meta name="description" content="Карточка приложения: регистрации, инсталы, депозиты по странам.">
  <link rel="canonical" href="https://wingasoanalytics.online/app.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=26">
</head>
<body data-page="app">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <p class="muted" id="back-link"><a href="/apps.html">← Приложения</a></p>
        <h1 id="title">Приложение</h1>
        <p class="muted" id="lead"></p>
      </div>
    </div>
    <section class="kpi-grid" id="kpis"></section>
    <p class="note" id="geo-note" hidden></p>
    <section class="grid-2">
      <article class="card chart-card">
        <h2>Выручка по дням</h2>
        <div class="chart-wrap"><canvas id="rev-line"></canvas></div>
      </article>
      <article class="card chart-card">
        <h2>Страны</h2>
        <div class="chart-wrap"><canvas id="country-bar"></canvas></div>
      </article>
    </section>
    <article class="card table-card desktop-only" style="margin-top:12px">
      <h2>По странам</h2>
      <div class="table-scroll">
        <table class="data" id="country-table">
          <thead>
            <tr>
              <th data-key="country" data-dir="asc">Страна</th>
              <th data-key="brand" data-dir="asc">Бренд</th>
              <th class="num" data-key="installs">Инсталы</th>
              <th class="num" data-key="leads">Регистрации</th>
              <th class="num" data-key="sales">Депозиты</th>
              <th class="num" data-key="revenue">Выручка</th>
              <th class="num" data-key="rate">Конверсия</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <div class="cards-mobile" id="app-country-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=14"></script>
  <script src="/js/ui.js?v=10"></script>
  <script src="/js/charts.js?v=16"></script>
  <script src="/js/tables.js?v=3"></script>
  <script src="/js/main.js?v=21"></script>
</body>
</html>
