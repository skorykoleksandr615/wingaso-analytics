<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бренд — WingAso Analytics</title>
  <meta name="description" content="Карточка бренда: выручка по дням, страны и приложения.">
  <link rel="canonical" href="https://wingasoanalytics.online/brand.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=16">
</head>
<body data-page="brand">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <p class="muted" id="back-link"><a href="/brands.html">← Бренды</a></p>
        <h1 id="title">Бренд</h1>
        <p class="muted" id="lead"></p>
      </div>
    </div>
    <section class="grid-2">
      <article class="card chart-card">
        <h2>Выручка по дням</h2>
        <div class="chart-wrap"><canvas id="rev-line"></canvas></div>
      </article>
      <article class="card chart-card">
        <h2>Страны</h2>
        <div class="chart-wrap"><canvas id="country-bar"></canvas></div>
      </article>
    </section>
    <article class="card table-card desktop-only" style="margin-top:12px">
      <h2>По странам</h2>
      <div class="table-scroll">
        <table class="data" id="country-table">
          <thead>
            <tr>
              <th>Страна</th>
              <th class="num">Регистрации</th>
              <th class="num">Инсталы</th>
              <th class="num">Депозиты</th>
              <th class="num">Выручка</th>
              <th class="num">Конверсия</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <div class="cards-mobile" id="brand-country-cards"></div>
    <p class="note" id="apps-note" hidden></p>
    <article class="card table-card desktop-only" style="margin-top:12px">
      <h2 id="apps-head">Приложения</h2>
      <div class="table-scroll">
        <table class="data" id="app-table">
          <thead>
            <tr>
              <th>Пакет</th>
              <th class="num">Регистрации</th>
              <th class="num">Инсталы</th>
              <th class="num">Депозиты</th>
              <th class="num">Выручка</th>
              <th class="num">Страны</th>
              <th>Первый</th>
              <th>Последний</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <div class="cards-mobile" id="brand-app-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=7"></script>
  <script src="/js/ui.js?v=4"></script>
  <script src="/js/charts.js?v=6"></script>
  <script src="/js/tables.js?v=2"></script>
  <script src="/js/main.js?v=7"></script>
</body>
</html>
