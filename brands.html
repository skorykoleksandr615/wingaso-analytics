<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бренды — WingAso Analytics</title>
  <meta name="description" content="Таблица брендов: конверсии, лиды, продажи, выручка и страны.">
  <link rel="canonical" href="https://wingasoanalytics.online/brands.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=21">
</head>
<body data-page="brands">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>Бренды</h1>
        <p class="muted" id="updated"></p>
      </div>
    </div>
    <div class="toolbar">
      <input class="search" id="brand-search" placeholder="Поиск бренда">
      <input class="field" id="min-rev" type="number" min="0" placeholder="Мин. выручка">
      <div class="filter-chips" id="zero-filters">
        <label class="chip"><input type="checkbox" data-zero="noInst"> Без инсталов</label>
        <label class="chip"><input type="checkbox" data-zero="noLead"> Без регистраций</label>
        <label class="chip"><input type="checkbox" data-zero="noSale"> Без депозитов</label>
      </div>
    </div>
    <article class="card table-card desktop-only">
      <div class="table-scroll">
        <table class="data" id="brand-table">
          <thead>
            <tr>
              <th>#</th>
              <th data-key="brand" data-dir="asc">Бренд</th>
              <th class="num" data-key="leads">Регистрации</th>
              <th class="num" data-key="installs">Инсталы</th>
              <th class="num" data-key="sales">Депозиты</th>
              <th class="num" data-key="revenue">Выручка</th>
              <th class="num" data-key="rate">Конверсия</th>
              <th data-key="countryCount">Страны</th>
              <th>Тренд</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="brand-pager"></div>
    </article>
    <div class="cards-mobile" id="brand-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics · Нажмите бренд, чтобы открыть разбивку</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=11"></script>
  <script src="/js/ui.js?v=8"></script>
  <script src="/js/charts.js?v=10"></script>
  <script src="/js/tables.js?v=3"></script>
  <script src="/js/main.js?v=12"></script>
</body>
</html>
