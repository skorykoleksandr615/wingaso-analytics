<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Страны — WingAso Analytics</title>
  <meta name="description" content="Страны: выручка, конверсии, топ-бренд и фильтр по регионам.">
  <link rel="canonical" href="https://wingasoanalytics.online/countries.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=16">
</head>
<body data-page="countries">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>Страны</h1>
        <p class="muted" id="updated"></p>
      </div>
    </div>
    <div class="toolbar">
      <input class="search" id="country-search" placeholder="Поиск страны или ISO">
      <select class="field" id="region-filter">
        <option value="">Все регионы</option>
        <option value="Europe">Европа</option>
        <option value="Asia">Азия</option>
        <option value="Americas">Америка</option>
        <option value="Africa">Африка</option>
        <option value="Oceania">Океания</option>
      </select>
    </div>
    <article class="card table-card desktop-only">
      <div class="table-scroll">
        <table class="data" id="country-table">
          <thead>
            <tr>
              <th>#</th>
              <th data-key="country" data-dir="asc">Страна</th>
              <th class="num" data-key="leads">Регистрации</th>
              <th class="num" data-key="installs">Инсталы</th>
              <th class="num" data-key="sales">Депозиты</th>
              <th class="num" data-key="revenue">Выручка</th>
              <th class="num" data-key="rate">Конверсия</th>
              <th data-key="topBrand" data-dir="asc">Топ-бренд</th>
              <th>Тренд</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="country-pager"></div>
    </article>
    <div class="cards-mobile" id="country-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics · Нажмите страну, чтобы открыть бренды</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=6"></script>
  <script src="/js/ui.js?v=4"></script>
  <script src="/js/charts.js?v=4"></script>
  <script src="/js/tables.js?v=2"></script>
  <script src="/js/main.js?v=6"></script>
</body>
</html>
