<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countries — WingAso Analytics</title>
  <meta name="description" content="Country performance: revenue, conversions, top brand and regional filters for WingAso apps.">
  <link rel="canonical" href="https://wingasoanalytics.online/countries.html">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="countries">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>Countries</h1>
        <p class="muted" id="updated"></p>
      </div>
    </div>
    <div class="toolbar">
      <input class="search" id="country-search" placeholder="Search country or ISO">
      <select class="field" id="region-filter">
        <option value="">All regions</option>
        <option>Europe</option>
        <option>Asia</option>
        <option>Americas</option>
        <option>Africa</option>
        <option>Oceania</option>
      </select>
    </div>
    <article class="card table-card desktop-only">
      <div class="table-scroll">
        <table class="data" id="country-table">
          <thead>
            <tr>
              <th>#</th>
              <th data-key="country" data-dir="asc">Country</th>
              <th class="num" data-key="conversions">Conversions</th>
              <th class="num" data-key="leads">Leads</th>
              <th class="num" data-key="sales">Sales</th>
              <th class="num" data-key="revenue">Revenue</th>
              <th class="num" data-key="rate">Rate</th>
              <th data-key="topBrand" data-dir="asc">Top brand</th>
              <th>Trend</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="country-pager"></div>
    </article>
    <div class="cards-mobile" id="country-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics · Click a country for brand split</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/tables.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
