<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily — WingAso Analytics</title>
  <meta name="description" content="Daily calendar of conversions, sales, revenue, top brand and day-over-day change.">
  <link rel="canonical" href="https://wingasoanalytics.online/daily.html">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="daily">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>Daily</h1>
        <p class="muted" id="updated"></p>
      </div>
    </div>
    <article class="card chart-card" style="margin-bottom:12px">
      <h2>Top 5 brands — stacked revenue</h2>
      <div class="chart-wrap"><canvas id="stack-area"></canvas></div>
    </article>
    <article class="card table-card">
      <div class="table-scroll">
        <table class="data" id="daily-table">
          <thead>
            <tr>
              <th>Date</th>
              <th class="num">Conversions</th>
              <th class="num">Leads</th>
              <th class="num">Sales</th>
              <th class="num">Revenue</th>
              <th>Top brand</th>
              <th class="num">vs previous day</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
  </main>
  <footer class="footer">WingAso Analytics · Sharp swings are highlighted</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/tables.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
