<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>По дням — WingAso Analytics</title>
  <meta name="description" content="Календарь конверсий, продаж, выручки и топ-бренда по дням.">
  <link rel="canonical" href="https://wingasoanalytics.online/daily.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body data-page="daily">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>По дням</h1>
        <p class="muted" id="updated"></p>
      </div>
    </div>
    <article class="card chart-card" style="margin-bottom:12px">
      <h2>Топ-5 брендов — выручка</h2>
      <div class="chart-wrap"><canvas id="stack-area"></canvas></div>
    </article>
    <article class="card table-card desktop-only">
      <div class="table-scroll">
        <table class="data" id="daily-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th class="num">Регистрации</th>
              <th class="num">Инсталы</th>
              <th class="num">Депозиты</th>
              <th class="num">Выручка</th>
              <th>Топ-бренд</th>
              <th class="num">к предыдущему дню</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <div class="cards-mobile" id="daily-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics · Резкие скачки выделены</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=5"></script>
  <script src="/js/ui.js?v=4"></script>
  <script src="/js/charts.js?v=4"></script>
  <script src="/js/tables.js?v=2"></script>
  <script src="/js/main.js?v=4"></script>
</body>
</html>
