<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>По дням — WingAso Analytics</title>
  <meta name="description" content="Календарь конверсий, продаж, выручки и топ-бренда по дням.">
  <link rel="canonical" href="https://wingasoanalytics.online/daily.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=31">
</head>
<body data-page="daily">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>По дням</h1>
        <p class="muted" id="updated"></p>
      </div>
    </div>
    <article class="card chart-card" style="margin-bottom:12px">
      <div class="chart-head">
        <h2 id="stack-title">Топ брендов — выручка</h2>
        <select class="field" id="top-n" aria-label="Сколько брендов в топе">
          <option value="3">Топ 3</option>
          <option value="5">Топ 5</option>
          <option value="8">Топ 8</option>
          <option value="10">Топ 10</option>
          <option value="15">Топ 15</option>
          <option value="20">Топ 20</option>
          <option value="30">Топ 30</option>
          <option value="50">Топ 50</option>
          <option value="75">Топ 75</option>
          <option value="100">Топ 100</option>
          <option value="150">Топ 150</option>
          <option value="200">Топ 200</option>
        </select>
      </div>
      <div class="chart-wrap"><canvas id="stack-area"></canvas></div>
    </article>
    <article class="card table-card desktop-only">
      <div class="table-scroll">
        <table class="data" id="daily-table">
          <thead>
            <tr>
              <th data-key="date" data-dir="asc">Дата</th>
              <th class="num" data-key="leads">Регистрации</th>
              <th class="num" data-key="installs">Инсталы</th>
              <th class="num" data-key="sales">Депозиты</th>
              <th class="num" data-key="revenue">Выручка</th>
              <th data-key="topBrand" data-dir="asc">Топ-бренд</th>
              <th class="num" data-key="appCount">Прилы</th>
              <th class="num" data-key="change">к предыдущему дню</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <div class="cards-mobile" id="daily-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics · Резкие скачки выделены</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=31"></script>
  <script src="/js/ui.js?v=13"></script>
  <script src="/js/charts.js?v=16"></script>
  <script src="/js/tables.js?v=3"></script>
  <script src="/js/main.js?v=33"></script>
</body>
</html>
