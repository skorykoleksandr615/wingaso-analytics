<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Беспонт — WingAso Analytics</title>
  <meta name="description" content="Бренды и приложения без депозитов, регистраций или инсталов за период.">
  <link rel="canonical" href="https://wingasoanalytics.online/dead.html">
  <link rel="icon" href="/assets/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=31">
</head>
<body data-page="dead">
  <header class="app-header" id="app-header"></header>
  <main class="wrap" id="content">
    <div class="page-head">
      <div>
        <h1>Беспонт</h1>
        <p class="muted" id="updated"></p>
        <p class="muted">Бренды и прилы без депозитов за выбранный период. С депами сюда не попадают. Период сверху.</p>
      </div>
    </div>
    <section class="kpi-grid" id="kpis"></section>
    <div class="toolbar">
      <input class="search" id="dead-search" placeholder="Поиск бренда или пакета">
      <div class="filter-chips" id="zero-filters">
        <label class="chip"><input type="checkbox" data-zero="noLead"> Без регистраций</label>
        <label class="chip"><input type="checkbox" data-zero="noInst"> Без инсталов</label>
        <label class="chip"><input type="checkbox" data-zero="hasTraffic" checked> Был траф</label>
      </div>
    </div>
    <article class="card table-card desktop-only">
      <h2 id="dead-brands-title">Бренды</h2>
      <div class="table-scroll">
        <table class="data" id="dead-brand-table">
          <thead>
            <tr>
              <th data-key="brand" data-dir="asc">Бренд</th>
              <th class="num" data-key="appCount">Прилы</th>
              <th class="num" data-key="countries">Страны</th>
              <th class="num" data-key="installs">Инсталы</th>
              <th class="num" data-key="leads">Регистрации</th>
              <th class="num" data-key="sales">Депозиты</th>
              <th class="num" data-key="revenue">Выручка</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="dead-brand-pager"></div>
    </article>
    <div class="cards-mobile" id="dead-brand-cards"></div>
    <article class="card table-card desktop-only" style="margin-top:12px">
      <h2 id="dead-apps-title">Приложения</h2>
      <div class="table-scroll">
        <table class="data" id="dead-app-table">
          <thead>
            <tr>
              <th data-key="package" data-dir="asc">Пакет</th>
              <th data-key="brand" data-dir="asc">Бренд</th>
              <th class="num" data-key="countries">Страны</th>
              <th class="num" data-key="installs">Инсталы</th>
              <th class="num" data-key="leads">Регистрации</th>
              <th class="num" data-key="sales">Депозиты</th>
              <th class="num" data-key="revenue">Выручка</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="dead-app-pager"></div>
    </article>
    <div class="cards-mobile" id="dead-app-cards"></div>
  </main>
  <footer class="footer">WingAso Analytics · Беспонт за выбранный период</footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/data.js?v=27"></script>
  <script src="/js/ui.js?v=13"></script>
  <script src="/js/charts.js?v=16"></script>
  <script src="/js/tables.js?v=3"></script>
  <script src="/js/main.js?v=29"></script>
</body>
</html>
